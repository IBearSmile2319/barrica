# Catálogo de instalación de Barrica.
#
# Barrica lo descarga solo al abrirse (ajuste `catalog_url`), así que añadir o corregir una app
# aquí llega a la app sin publicar una versión nueva. Formato: catalog/README.md.

format = 1
updated = "2026-10-14"

[[category]]
id = "tiendas"
name = "Tiendas de juegos"

[[category]]
id = "utilidades"
name = "Utilidades"

[[category]]
id = "documentos"
name = "Oficina y documentos"

[[category]]
id = "multimedia"
name = "Multimedia"

[[category]]
id = "desarrollo"
name = "Desarrollo y redes"

[[category]]
id = "comunicacion"
name = "Comunicación"

# ---------- Tiendas de juegos ----------

[[app]]
id = "steam"
name = "Steam"
publisher = "Valve"
category = "tiendas"
featured = true
summary = "La tienda y biblioteca de juegos de Valve."
description = "Compra, descarga y juega tu biblioteca de Steam. Barrica añade un lanzador directo por cada juego instalado, con su portada."
icon = "steam"
color = "#1B2838"
homepage = "https://store.steampowered.com"
url = "https://cdn.akamai.steamstatic.com/client/installer/SteamSetup.exe"
exe = ["Program Files (x86)/Steam/steam.exe"]
notes = "Los juegos con antitrampas a nivel de kernel no funcionan en Wine."

[[app]]
id = "battlenet"
name = "Battle.net"
publisher = "Blizzard"
category = "tiendas"
featured = true
summary = "Diablo, World of Warcraft, Overwatch y Call of Duty."
description = "El lanzador de Blizzard. El instalador descarga la última versión de Battle.net al abrirse."
icon = "battledotnet"
color = "#148EFF"
homepage = "https://battle.net"
url = "https://downloader.battle.net/download/getInstaller?os=win&installer=Battle.net-Setup.exe"
file = "Battle.net-Setup.exe"
exe = ["Program Files (x86)/Battle.net/Battle.net Launcher.exe", "Program Files (x86)/Battle.net/Battle.net.exe"]

[[app]]
id = "epic"
name = "Epic Games"
publisher = "Epic Games"
