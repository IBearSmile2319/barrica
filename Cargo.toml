[package]
name = "barrica"
version = "0.2.0"
edition = "2024"
description = "Juegos y apps de Windows en macOS: bottles de Wine con motor propio, catálogo y snapshots"
license = "GPL-3.0-or-later"
repository = "https://github.com/ibearsmile2319/barrica"
homepage = "https://ibearsmile2319.github.io/barrica/"

[dependencies]
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image", "file", "svg"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2.190" # ya venía con eframe; fcntl(F_GETLK) para saber si un wineserver sigue vivo
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.1.8"
