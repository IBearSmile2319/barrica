[package]
name = "barrica"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image", "file"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2.190" # ya venía con eframe; fcntl(F_GETLK) para saber si un wineserver sigue vivo
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
